name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          gradle             --no-daemon             --stacktrace             :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not created."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: S23-Ultra-Camera-Rebuild-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
