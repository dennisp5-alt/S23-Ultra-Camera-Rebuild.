name: Build APK

on:
  push:
    branches: [ main ]
  # Pull requests get a test build too, so changes are proven to compile
  # (and the APK can be tried) before they are merged.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Signed release build when the 4 SIGNING_* secrets exist (same key every
      # run, so each new APK installs over the previous one). Without them it
      # falls back to a debug build, which gets a NEW random key every run.
      - name: Build APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -eu

          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            gradle --no-daemon --stacktrace :app:assembleRelease
            BUILT="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
            KIND="release"
          else
            echo "::warning::SIGNING_* secrets not set - building a DEBUG APK. Its signature changes every run, so it cannot install over the previous build."
            # The unsigned release build isn't uploaded; it only proves the
            # shrunk (R8) release still compiles before signing is set up.
            gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease
            BUILT="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
            KIND="debug"
          fi

          if [ -z "$BUILT" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          OUT="S23-Ultra-Camera-v${VERSION}-${KIND}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$BUILT" "$OUT"
          ls -lh "$OUT"

          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          echo "APK_NAME=${OUT%.apk}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
