name: Camera Check (capability report app)

on:
  push:
    branches: [ camera-check ]
    paths:
      - tools/camera-check/**
      - .github/workflows/camera-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Camera Check APK
        working-directory: tools/camera-check
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Package
        run: cp tools/camera-check/app/build/outputs/apk/debug/app-debug.apk Camera-Check-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Camera-Check-1.0
          path: Camera-Check-1.0.apk
          if-no-files-found: error
          retention-days: 30
